<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise for Neha! 💖</title>
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        body { margin: 0; background: #fff0f3; font-family: 'Poppins', sans-serif; overflow-x: hidden; text-align: center; }
        #loader-page { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: white; position: fixed; width: 100%; z-index: 1000; transition: 1.5s; }
        .heart-loader { color: #ff4d6d; font-size: 60px; animation: beat 0.8s infinite; }
        @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.4); } }
        #main-content { display: none; padding: 40px 20px; animation: fadeIn 2s; }
        h1 { font-family: 'Dancing Script', cursive; font-size: 3.5rem; color: #ff4d6d; margin: 10px 0; }
        .floating { position: absolute; bottom: -100px; opacity: 0.7; animation: floatUp 10s infinite linear; pointer-events: none; }
        @keyframes floatUp { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-120vh) rotate(360deg); } }
        .photo-frame { width: 180px; height: 180px; border-radius: 50%; border: 8px solid #ff4d6d; margin: 20px auto; box-shadow: 0 0 25px rgba(255, 77, 109, 0.6); padding: 5px; background: white; display: none; animation: popIn 1s cubic-bezier(0.17, 0.67, 0.83, 0.67); overflow: hidden; }
        .photo-frame img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        @keyframes popIn { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        .card { background: white; max-width: 450px; margin: 20px auto; padding: 30px; border-radius: 30px; box-shadow: 0 20px 50px rgba(255, 77, 109, 0.15); border: 1px solid #ffccd5; }
        button { background: linear-gradient(45deg, #ff4d6d, #ff758f); color: white; border: none; padding: 18px 40px; border-radius: 50px; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.4s; box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3); }
        .message-box { display: none; margin-top: 25px; color: #c9184a; font-size: 1.2rem; line-height: 1.6; }
        @keyframes fadeIn { from {opacity: 0;} to {opacity: 1;} }
    </style>
</head>
<body>

    <div id="loader-page">
        <div class="heart-loader">❤️</div>
        <p style="color: #ff4d6d; font-weight: bold;">Locating the Birthday Girl... 📍</p>
    </div>

    <div id="main-content">
        <div id="elements-container"></div>
        <h1>Happy Birthday, Neha! 👸</h1>
        <div class="card">
            <div id="frame" class="photo-frame">
                <!-- Neha's Photo Link -->
                <img src="https://i.ibb.co" alt="Neha">
            </div>
            <p style="font-size: 1.3rem; color: #555;">Today is your special day! ✨</p>
            <button id="giftBtn" onclick="revealAll()">Open Your Surprise 🎁</button>
            <div id="msg" class="message-box">
                <b>"Happy Birthday to my Best Friend! 🎂"</b><br>
                May your year be as bright as your smile. 💖<br>
                Hamesha aise hi khush rehna, Neha! ✨
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net"></script>
    <script>
        setTimeout(() => {
            document.getElementById('loader-page').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loader-page').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                startMagic();
            }, 1000);
        }, 3000);

        function startMagic() {
            const container = document.getElementById('elements-container');
            const items = ['🎈', '💖', '⭐', '🎊'];
            for(let i=0; i<30; i++) {
                let el = document.createElement('div');
                el.className = 'floating';
                el.innerText = items[Math.floor(Math.random() * items.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.fontSize = (Math.random() * 20 + 20) + 'px';
                el.style.animationDelay = Math.random() * 7 + 's';
                container.appendChild(el);
            }
        }

        function revealAll() {
            document.getElementById('frame').style.display = 'block';
            document.getElementById('msg').style.display = 'block';
            document.getElementById('giftBtn').style.display = 'none';
            var end = Date.now() + (5 * 1000);
            (function frame() {
                confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff4d6d', '#ffffff'] });
                confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff4d6d', '#ffffff'] });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        }
    </script>
</body>
</html>
